[sampling]
interval_seconds = 2
min_interval = 1
max_interval = 60

[storage]
db_path = "nmon.db"
retention_hours = 24

[display]
default_tab = "dashboard"
default_time_window_hours = 1
# Temp-tab threshold line (first-run default). After the first run the
# live value and on/off state are persisted in .nmon_state.json next to
# the DB and override these values on the next startup.
temp_threshold_c = 95.0
show_temp_threshold = true

[ollama]
# Set enabled=false to skip Ollama detection entirely. When enabled, nmon
# probes this URL at startup and (if reachable) polls /api/ps every sampling
# interval for the currently loaded model and its GPU/CPU split.
enabled = true
url = "http://localhost:11434"

[vllm]
# Local vLLM runs in WSL2 on port 11436. WSL2 mirrored networking does NOT
# bridge vLLM's uvicorn listener to the Windows host (the homelab wiki's
# local-llm.md troubleshooting documents the symptom and the SO_REUSEPORT /
# dual-stack v6 socket-option hypothesis). The workaround is a plain-bind
# socat relay inside WSL on port 11437 forwarding to vLLM:
#   systemd-run --user --unit=vllm-relay \
#     socat TCP4-LISTEN:11437,fork,reuseaddr TCP4:192.168.1.126:11436
# nmon talks to the relay (which mirrors cleanly), not vLLM directly.
enabled = true
# 127.0.0.1 (not localhost) — socat listens IPv4-only (TCP4-LISTEN). With
# `localhost`, Python's happy-eyeballs tries ::1 first, sits 5 s on the empty
# IPv6 port, then falls back to IPv4. The explicit v4 address skips that.
url = "http://127.0.0.1:11437"
